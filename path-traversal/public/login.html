<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FileVault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      line-height: 1.5;
    }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 1.5rem;
    }
    .login-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 0.35rem; }
    .login-card h1 span { color: #6366f1; }
    .login-card p { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label.field-label { display: block; font-size: 0.82rem; font-weight: 600; color: #475569; margin-bottom: 0.4rem; }
    .login-input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #0f172a;
      background: #fff;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    .login-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .login-error { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .login-error.visible { display: block; }
    .btn-signin {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-signin:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1><span>File</span>Vault</h1>
      <p>Your files, always available</p>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <label class="field-label" for="username">Username</label>
        <input type="text" class="login-input" id="username" value="alice" autocomplete="username">
        <label class="field-label" for="password">Password</label>
        <input type="password" class="login-input" id="password" value="alice123" autocomplete="current-password">
        <button type="submit" class="btn-signin">Sign In</button>
      </form>
    </div>
  </div>
  <script>
    if (localStorage.getItem('authToken')) window.location.href = '/';
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var errEl = document.getElementById('login-error');
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok) {
            errEl.textContent = res.data.error || 'Login failed';
            errEl.className = 'login-error visible';
            return;
          }
          localStorage.setItem('authToken', res.data.token);
          window.location.href = '/';
        })
        .catch(function(err) {
          errEl.textContent = err.message;
          errEl.className = 'login-error visible';
        });
    });
  </script>
</body>
</html>
