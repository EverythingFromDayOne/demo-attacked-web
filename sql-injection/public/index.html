<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLinks — Developer Resources</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: #6366f1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .demo-banner {
      padding: 0.65rem 1.5rem;
      font-size: 0.82rem;
      text-align: center;
      font-weight: 500;
      border-bottom: 2px solid;
    }
    .topnav {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wordmark {
      font-weight: 700;
      font-size: 1.15rem;
      color: #0f172a;
    }
    .wordmark span { color: #6366f1; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .nav-links a:hover { color: #6366f1; }
    .nav-links a.active { color: #6366f1; }
    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 3rem;
    }
    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .search-input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .search-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .btn-search, .btn-primary {
      padding: 0.65rem 1.25rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-search:hover, .btn-primary:hover { background: #4f46e5; }
    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .section-sub {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
    }
    .resource-grid {
      display: grid;
      gap: 1rem;
    }
    .resource-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.15rem 1.25rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .resource-card:hover { border-color: #cbd5e1; }
    .resource-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.35rem;
    }
    .resource-url {
      font-size: 0.82rem;
      color: #6366f1;
      word-break: break-all;
      margin-bottom: 0.5rem;
    }
    .resource-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.78rem;
      color: #64748b;
    }
    .tag-pill {
      background: #eef2ff;
      color: #4338ca;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }
    .empty-state {
      background: #fff;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      color: #64748b;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 1rem;
      color: #991b1b;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      font-family: 'Courier New', monospace;
      word-break: break-word;
    }
    .hint-note {
      color: #64748b;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    details.hint-panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: #475569;
    }
    details.hint-panel summary {
      cursor: pointer;
      color: #64748b;
      font-weight: 500;
    }
    details.hint-panel pre {
      margin-top: 0.75rem;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .login-card {
      max-width: 400px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .login-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.25rem;
    }
    .login-card p {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }
    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 0.65rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.88rem;
    }
    th {
      text-align: left;
      padding: 0.65rem 0.85rem;
      background: #f1f5f9;
      color: #64748b;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }
    td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid #e2e8f0;
    }
    tr:last-child td { border-bottom: none; }
    .role-admin { color: #b45309; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="demo-banner" class="demo-banner"></div>
  <header class="topnav">
    <div class="wordmark">Dev<span>Links</span></div>
    <nav class="nav-links">
      <a href="/" id="nav-home">Search</a>
      <a href="#">Bookmarks</a>
      <a href="/admin" id="nav-admin">Admin</a>
    </nav>
  </header>
  <div class="shell" id="app"></div>

  <script>
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function buildResourceCards(results) {
      if (!results.length) {
        return '<div class="empty-state">No resources found for this query.</div>';
      }
      return (
        '<div class="resource-grid">' +
        results.map(function (row) {
          return (
            '<article class="resource-card">' +
              '<div class="resource-title">' + escapeHtml(row.title) + '</div>' +
              '<div class="resource-url">' + escapeHtml(row.url) + '</div>' +
              '<div class="resource-meta">' +
                '<span class="tag-pill">' + escapeHtml(row.tags || '') + '</span>' +
                '<span>by ' + escapeHtml(row.author || '') + '</span>' +
              '</div>' +
            '</article>'
          );
        }).join('') +
        '</div>'
      );
    }

    function buildSearchForm(q) {
      var value = escapeHtml(q || '');
      return (
        '<form class="search-bar" method="GET" action="/search">' +
          '<input class="search-input" type="text" name="q" value="' + value + '" placeholder="Search resources by title or tags…">' +
          '<button class="btn-search" type="submit">Search</button>' +
        '</form>'
      );
    }

    function setNavActive(active) {
      document.getElementById('nav-home').classList.toggle('active', active === 'home');
      document.getElementById('nav-admin').classList.toggle('active', active === 'admin');
    }

    function renderHome() {
      setNavActive('home');
      document.title = 'DevLinks — Developer Resources';
      var app = document.getElementById('app');
      app.innerHTML =
        buildSearchForm('') +
        '<div class="section-title">Featured Resources</div>' +
        '<div class="section-sub">Curated links for developers — search above or browse below</div>' +
        '<div id="resource-list"><div class="empty-state">Loading resources…</div></div>';

      fetch('/api/resources')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          document.getElementById('resource-list').innerHTML = buildResourceCards(data.resources || []);
        });
    }

    function renderSearch(q) {
      setNavActive('home');
      document.title = 'DevLinks — Search';
      var app = document.getElementById('app');
      app.innerHTML =
        buildSearchForm(q) +
        '<div id="search-error"></div>' +
        '<p class="hint-note">Search queries resources.title and resources.tags</p>' +
        '<details class="hint-panel">' +
          '<summary>Try injecting</summary>' +
          '<pre>Normal search:    javascript\n' +
          'Login bypass:     Open /admin — username: admin\'--  password: anything\n' +
          'UNION dump:       \' UNION SELECT id,username,password,email,\'\' FROM users--</pre>' +
        '</details>' +
        '<div class="section-title">Search Results</div>' +
        '<div class="section-sub" id="search-sub">' + (q ? 'Query: ' + escapeHtml(q) : 'Enter a search term') + '</div>' +
        '<div id="search-results"><div class="empty-state">Searching…</div></div>';

      fetch('/api/search?q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.error) {
            document.getElementById('search-error').innerHTML =
              '<div class="error-box">SQLite error: ' + escapeHtml(data.error) + '</div>';
          }
          document.getElementById('search-results').innerHTML = buildResourceCards(data.results || []);
        });
    }

    function renderAdminLogin(hasError) {
      setNavActive('admin');
      document.title = 'DevLinks — Admin Login';
      var errorBlock = hasError ? '<div class="login-error">Invalid credentials</div>' : '';
      document.getElementById('app').innerHTML =
        '<div class="login-card">' +
          '<h1>Admin Login</h1>' +
          '<p>Sign in to manage DevLinks resources and users.</p>' +
          errorBlock +
          '<form method="POST" action="/login">' +
            '<label class="field-label" for="username">Username</label>' +
            '<input class="field-input" type="text" id="username" name="username" required>' +
            '<label class="field-label" for="password">Password</label>' +
            '<input class="field-input" type="password" id="password" name="password" required>' +
            '<button class="btn-primary" type="submit" style="width:100%">Sign In</button>' +
          '</form>' +
        '</div>';
    }

    function renderAdminDashboard(users) {
      setNavActive('admin');
      document.title = 'DevLinks — Admin Dashboard';
      var rows = (users || []).map(function (user) {
        var roleClass = user.role === 'admin' ? ' class="role-admin"' : '';
        return (
          '<tr>' +
            '<td>' + user.id + '</td>' +
            '<td>' + escapeHtml(user.username) + '</td>' +
            '<td><code>' + escapeHtml(user.password) + '</code></td>' +
            '<td' + roleClass + '>' + escapeHtml(user.role) + '</td>' +
            '<td>' + escapeHtml(user.email) + '</td>' +
          '</tr>'
        );
      }).join('');

      document.getElementById('app').innerHTML =
        '<div class="section-title">User Database</div>' +
        '<div class="section-sub">All registered accounts — ' + (users || []).length + ' users</div>' +
        '<table>' +
          '<thead><tr><th>ID</th><th>Username</th><th>Password</th><th>Role</th><th>Email</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    }

    function route() {
      var path = window.location.pathname;
      var params = new URLSearchParams(window.location.search);

      if (path === '/search') {
        renderSearch(params.get('q') || '');
      } else if (path === '/admin') {
        renderAdminLogin(params.get('error') === '1');
      } else if (path === '/admin/dashboard') {
        fetch('/api/session')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.isAdmin) {
              window.location.href = '/admin';
              return;
            }
            renderAdminDashboard(data.users);
          });
      } else {
        renderHome();
      }
    }

    route();
  </script>
  <script>
    fetch('/api/config').then(r => r.json()).then(({ mode, port }) => {
      const b = document.getElementById('demo-banner');
      if (mode === 'protected') {
        Object.assign(b.style, { background: '#d1fae5', borderColor: '#059669', color: '#065f46' });
        b.textContent = '✅ Demo — Protected Mode (port ' + port + ')';
      } else {
        Object.assign(b.style, { background: '#fee2e2', borderColor: '#dc2626', color: '#991b1b' });
        b.textContent = '⚠️ Demo — Vulnerable Mode (port ' + port + ')';
      }
    });
  </script>
</body>
</html>
