<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCRM Internal — Agent Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #f1f5f9;
      color: #1e293b;
    }

    .sidebar {
      width: 260px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .org {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 2rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .agent-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .role-badge {
      display: inline-block;
      background: #1e3a5f;
      color: #93c5fd;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 2rem;
    }

    .sidebar-nav a {
      display: block;
      color: #94a3b8;
      text-decoration: none;
      padding: 0.6rem 0;
      font-size: 0.9rem;
    }

    .sidebar-nav a.active { color: #fff; font-weight: 600; }

    .main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .main h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #0f172a;
    }

    .cookie-banner {
      background: #fef9c3;
      border: 1px solid #fde047;
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #854d0e;
    }

    .cookie-banner strong { font-weight: 600; }

    .ticket-table {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .ticket-row {
      display: grid;
      grid-template-columns: 1fr 2fr auto auto;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      gap: 1rem;
    }

    .ticket-row:last-child { border-bottom: none; }

    .ticket-row .submitter {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .ticket-row .subject-text {
      color: #475569;
      font-size: 0.9rem;
    }

    .ticket-row .timestamp {
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: nowrap;
    }

    .btn-view {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-view:hover { background: #1d4ed8; }

    .expand-panel {
      display: none;
      grid-column: 1 / -1;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 1.25rem 1.5rem;
      font-size: 0.9rem;
      color: #334155;
      line-height: 1.7;
    }

    .expand-panel.open { display: block; }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 2fr auto auto;
      padding: 0.75rem 1.5rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="org">NovaCRM Internal</div>
    <div class="avatar">JD</div>
    <div class="agent-name">Agent John Doe</div>
    <div class="role-badge">Support Agent</div>
    <nav class="sidebar-nav">
      <a href="#" class="active">Ticket Queue</a>
      <a href="#">Knowledge Base</a>
      <a href="#">Team Settings</a>
    </nav>
  </aside>

  <div class="main">
    <h1>Support Ticket Queue</h1>

    <div class="cookie-banner">
      ⚠️ Demo: Your session cookie is: <strong id="cookie-display"></strong>
    </div>

    <div class="ticket-table">
      <div class="table-header">
        <span>Submitter</span>
        <span>Subject</span>
        <span>Received</span>
        <span></span>
      </div>
      <div id="ticket-list"></div>
    </div>
  </div>

  <script>
    document.getElementById('cookie-display').textContent = document.cookie || '(none)';

    function relativeTime(isoString) {
      const diff = Date.now() - new Date(isoString).getTime();
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;
      const days = Math.floor(hours / 24);
      return `${days} day${days > 1 ? 's' : ''} ago`;
    }

    function renderTickets(tickets) {
      const list = document.getElementById('ticket-list');
      list.innerHTML = '';

      tickets.forEach((ticket) => {
        const row = document.createElement('div');
        row.className = 'ticket-row';
        row.dataset.id = ticket.id;

        const submitter = document.createElement('span');
        submitter.className = 'submitter';
        submitter.textContent = ticket.name;

        const subject = document.createElement('span');
        subject.className = 'subject-text';
        subject.textContent = ticket.subject;

        const timestamp = document.createElement('span');
        timestamp.className = 'timestamp';
        timestamp.textContent = relativeTime(ticket.createdAt);

        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn-view';
        viewBtn.textContent = 'View';

        const panel = document.createElement('div');
        panel.className = 'expand-panel';
        // ✅ PROTECTED already applied: panel.textContent = ticket.message
        //    Using textContent instead of innerHTML means the browser treats the value
        //    as plain text — HTML tags are displayed as literal characters, never parsed.
        //    This neutralises the XSS payload stored in ticket.message.
        panel.textContent = ticket.message;

        viewBtn.addEventListener('click', () => {
          const isOpen = panel.classList.contains('open');
          document.querySelectorAll('.expand-panel.open').forEach((p) => p.classList.remove('open'));
          if (!isOpen) panel.classList.add('open');
        });

        row.appendChild(submitter);
        row.appendChild(subject);
        row.appendChild(timestamp);
        row.appendChild(viewBtn);
        row.appendChild(panel);
        list.appendChild(row);
      });
    }

    async function fetchTickets() {
      try {
        const res = await fetch('/api/tickets');
        const tickets = await res.json();
        renderTickets(tickets);
      } catch (err) {
        console.error('Failed to load tickets:', err);
      }
    }

    fetchTickets();
    setInterval(fetchTickets, 5000);
  </script>
</body>
</html>
