<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNest — Shop Smart, Nest Easy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafa;
      color: #1a2e2e;
      line-height: 1.5;
    }

    .demo-banner {
      background: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      color: #92400e;
      padding: 0.6rem 1.5rem;
      font-size: 0.85rem;
      text-align: center;
    }

    .demo-banner strong { font-weight: 700; }

    header {
      background: #0d6e6e;
      color: #fff;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    nav a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 1rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    nav a:hover { color: #fff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 1.25rem;
    }

    .hero {
      background: linear-gradient(135deg, #0d6e6e 0%, #0a5555 100%);
      color: #fff;
      padding: 3.5rem 2rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero p {
      opacity: 0.9;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .search-form {
      display: flex;
      max-width: 600px;
      margin: 0 auto;
      gap: 0.5rem;
    }

    .search-form input {
      flex: 1;
      padding: 0.85rem 1.15rem;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .search-form input:focus {
      outline: 3px solid rgba(245, 158, 11, 0.5);
    }

    .search-form button {
      background: #f59e0b;
      color: #1a2e2e;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-form button:hover { background: #d97706; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .section-title {
      font-size: 1.35rem;
      color: #0d6e6e;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .product-card:hover {
      box-shadow: 0 8px 24px rgba(13, 110, 110, 0.12);
      transform: translateY(-2px);
    }

    .product-emoji {
      background: #f0fafa;
      font-size: 3rem;
      text-align: center;
      padding: 1.5rem;
    }

    .product-info { padding: 1rem; }

    .product-category {
      font-size: 0.75rem;
      color: #0d6e6e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-name {
      font-size: 0.95rem;
      margin: 0.35rem 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .product-rating {
      font-size: 0.8rem;
      color: #f59e0b;
      margin-bottom: 0.5rem;
    }

    .product-rating span {
      color: #64748b;
      margin-left: 0.25rem;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0d6e6e;
      margin-bottom: 0.75rem;
    }

    .btn-cart {
      width: 100%;
      background: #0d6e6e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cart:hover { background: #0a5555; }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 2rem;
    }

    footer {
      background: #0d6e6e;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="demo-banner">
    ⚠️ Demo: Your session cookie is: <strong id="cookie-display"></strong>
  </div>

  <header>
    <div class="logo">ShopNest 🛒</div>
    <nav>
      <a href="#">Categories</a>
      <a href="#">Deals</a>
      <a href="#">New Arrivals</a>
      <a href="#">Help</a>
    </nav>
    <div class="header-right">
      <span title="Cart">🛍️</span>
      <span title="Account">👤</span>
    </div>
  </header>

  <section class="hero">
    <h1>Find everything you need</h1>
    <p>Free shipping on orders over $50 · 30-day returns · Price match guarantee</p>
    <form class="search-form" action="/search" method="GET">
      <input type="text" name="q" placeholder="Search for headphones, jackets, kitchen gadgets..." required>
      <button type="submit">Search</button>
    </form>
  </section>

  <main>
    <h2 class="section-title">Trending This Week</h2>
    <div class="product-grid" id="product-grid">
      <p class="loading">Loading products...</p>
    </div>
  </main>

  <footer>
    © 2026 ShopNest Inc. · Privacy · Terms · Customer Service
  </footer>

  <script>
    document.getElementById('cookie-display').textContent = document.cookie || '(none)';

    function renderStars(rating) {
      const full = Math.floor(rating);
      return '★'.repeat(full) + '☆'.repeat(5 - full) + ' <span>' + rating + '</span>';
    }

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const res = await fetch('/api/products');
        const products = await res.json();

        grid.innerHTML = products.map(function (p) {
          return (
            '<div class="product-card">' +
              '<div class="product-emoji">' + p.imageEmoji + '</div>' +
              '<div class="product-info">' +
                '<span class="product-category">' + p.category + '</span>' +
                '<h3 class="product-name">' + p.name + '</h3>' +
                '<div class="product-rating">' + renderStars(p.rating) + '</div>' +
                '<div class="product-price">$' + p.price.toFixed(2) + '</div>' +
                '<button class="btn-cart" type="button">Add to Cart</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      } catch (err) {
        grid.innerHTML = '<p class="loading">Could not load products.</p>';
      }
    }

    loadProducts();
  </script>
</body>
</html>
